name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"

env:
  GOWORK: "off"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needs to be run on:"; echo "$out"; exit 1; fi
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test (race, coverage)
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=cover.out ./...
      - name: Enforce coverage floor (80%)
        run: |
          go tool cover -func=cover.out | tail -1
          pct=$(go tool cover -func=cover.out | awk '/^total:/{print $3}' | tr -d '%')
          awk -v p="$pct" 'BEGIN{exit (p+0<80.0)?1:0}'

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - ./server FuzzMutatingBodies
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: Fuzz ${{ matrix.target }}
        run: |
          set -- ${{ matrix.target }}
          go test -run '^$' -fuzz "^$2\$" -fuzztime 60s "$1"

  # The README's Caddyfile example, extracted by the test, run through the real
  # Caddy with a fake oauth2-proxy and a fake slides-gitd (#11). A skip fails.
  caddy-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Caddy v2.11.7
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.7
      - name: README Caddyfile identity headers (real Caddy)
        working-directory: caddytest
        env:
          CADDY_BIN: ${{ runner.temp }}/bin/caddy
          REQUIRE_CADDY: "1"
        run: go test -count=1 -v ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, linux/riscv64, linux/s390x, linux/386, darwin/arm64, windows/amd64, freebsd/amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: Build ${{ matrix.target }}
        run: |
          export GOOS=$(echo "${{ matrix.target }}" | cut -d/ -f1)
          export GOARCH=$(echo "${{ matrix.target }}" | cut -d/ -f2)
          go build ./...
